[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "koaltq-gemma"
version = "0.1.0"
description = "KoAltQ Gemma NLL full-data QLoRA training and per-epoch test predictions"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["gemma", "gemma.*"]
exclude = ["gemma.tests", "gemma.tests.*"]
namespaces = true

[tool.setuptools.package-data]
gemma = ["baseline_config.json", "METHOD_PRESERVATION.json", "runtime/prompts/*.txt", "resources/*.csv"]

[tool.pytest.ini_options]
testpaths = ["gemma/tests"]
pythonpath = ["."]

